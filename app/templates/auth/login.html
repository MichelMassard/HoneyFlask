{% extends "base.html" %}

{% block title %}Accesso{% endblock %}

{% block content %}
<h1>Accesso alla dashboard</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
    <p><label>Utente<br><input type="text" name="username" autofocus></label></p>
    <p><label>Password<br><input type="password" name="password"></label></p>
    <button type="submit">Accedi</button>
</form>
{% endblock %}
